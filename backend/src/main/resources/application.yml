server:
  port: ${PORT:8080}
  # Tomcat's RemoteIpValve: honours X-Forwarded-For only from internal proxy addresses, so clients cannot spoof it.
  forward-headers-strategy: native

spring:
  application:
    name: ledgerline-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${DB_APP_USERNAME:ledger_app}
    password: ${DB_APP_PASSWORD:app_local}

  jackson:
    deserialization:
      accept-float-as-int: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    user: ${DB_OWNER_USERNAME:ledger_owner}
    password: ${DB_OWNER_PASSWORD:owner_local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Railway Redis requires auth. Empty locally: Spring treats an empty password as "no AUTH".
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      # Short, so a Redis outage makes the rate limiter fail open quickly instead of stalling requests.
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true

ledgerline:
  jwt:
    secret: "${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}"
    ttl-minutes: ${JWT_TTL_MINUTES:30}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  anomaly:
    large-amount-paise: 5000000
    repeated-refusals-count: 3
    repeated-refusals-window-seconds: 600
    rapid-debits-count: 5
    rapid-debits-window-seconds: 60
    near-drain-min-amount-paise: 1000000
    near-drain-remaining-percent: 5
  seed:
    enabled: ${SEED_DEMO_DATA:false}
    password: ${SEED_DEMO_PASSWORD:}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-ip:
      limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
      window-seconds: ${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:60}
    login-email:
      limit: ${RATE_LIMIT_LOGIN_EMAIL_LIMIT:5}
      window-seconds: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW_SECONDS:900}
    register-ip:
      limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:20}
      window-seconds: ${RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:3600}
    money:
      limit: ${RATE_LIMIT_MONEY_LIMIT:60}
      window-seconds: ${RATE_LIMIT_MONEY_WINDOW_SECONDS:60}
    api:
      limit: ${RATE_LIMIT_API_LIMIT:300}
      window-seconds: ${RATE_LIMIT_API_WINDOW_SECONDS:60}
